<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CROSSROADS // COSMOGRAM PORTAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #d1d1d1; font-family: 'Courier New', Courier, monospace; padding: 20px; line-height: 1.4; }
        .launcher-frame { max-width: 1000px; margin: 0 auto; border: 1px solid #d1d1d1; padding: 20px; }
        header { border-bottom: 2px solid #cf2121; padding-bottom: 10px; margin-bottom: 20px; }
        header h1 { color: #fbbf24; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .portal-engine { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 768px) { .portal-engine { grid-template-columns: 1fr; } }
        .visual-matrix { border: 1px solid #333; padding: 20px; background: #0a0a0a; }
        svg { width: 100%; height: auto; }
        .cosmogram-point circle { fill: #000; stroke: #9ca3af; stroke-width: 2; cursor: pointer; }
        .cosmogram-point:hover circle, .cosmogram-point.active circle { stroke: #fbbf24; fill: #fbbf24; }
        .cosmogram-label { fill: #9ca3af; font-size: 10px; text-transform: uppercase; pointer-events: none; }
        #timeline-intercept { border: 1px solid #cf2121; padding: 20px; background: #050505; color: #e5e7eb; min-height: 300px; }
        .node-header { color: #fbbf24; text-transform: uppercase; font-size: 1.1rem; margin-bottom: 10px; }
        /* WZRD FM MODULE */
        #wzrd-tuner { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; border-top: 2px solid #cf2121; padding: 10px; z-index: 9999; }
        #track-info-container { width: 100%; overflow: hidden; border: 1px solid #333; }
        #track-info { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; color: #fbbf24; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
    </style>
</head>
<body>

    <div class="launcher-frame">
        <header>
            <h1>COSMOGRAM PORTAL // ARCHIVE RADAR</h1>
        </header>

        <div class="portal-engine">
            <div class="visual-matrix">
                <svg viewBox="0 0 500 500">
                    <circle cx="250" cy="250" r="180" fill="none" stroke="#333" stroke-dasharray="4"/>
                    <!-- Points -->
                    <g class="cosmogram-point" data-point="east" onclick="renderNode('east')"><circle cx="430" cy="250" r="8"/><text class="cosmogram-label" x="430" y="275" text-anchor="middle">East</text></g>
                    <g class="cosmogram-point" data-point="north" onclick="renderNode('north')"><circle cx="250" cy="70" r="8"/><text class="cosmogram-label" x="250" y="45" text-anchor="middle">North</text></g>
                </svg>
            </div>
            <div id="timeline-intercept">
                <p>SELECT A COORDINATE TO INITIALIZE INTERCEPT...</p>
            </div>
        </div>
    </div>

    <!-- WZRD 77.7 FM -->
    <audio id="radio-player" style="display:none;"></audio>
    <div id="wzrd-tuner">
        <div style="display:flex; justify-content:space-between;">
            <div style="color:#cf2121; font-family: 'Courier New'; font-weight: bold;">WZRD 77.7 FM</div>
            <button id="tune-btn" style="background:transparent; border:1px solid #cf2121; color:#cf2121; cursor:pointer; font-family:inherit;">TUNING...</button>
        </div>
        <div id="track-info-container"><div id="track-info">STATION STANDBY...</div></div>
    </div>

    <script>
        const timelines = {
            east: { title: "EAST: UPRISING EXPOSED", narrative: "Tyra Washington stands at the intersection of I-65, anchoring the neighborhood network." },
            north: { title: "NORTH: SANCTUARY ROOTS", narrative: "The physical footprint of the Sanctuary establishes structural parameters." }
        };

        const radioConfig = { file: 'Innerstates.mp3', title: 'WZRD // INNERSTATES ARCHIVE BROADCAST' };

        function renderNode(id) {
            const data = timelines[id];
            document.getElementById('timeline-intercept').innerHTML = `<h3 class="node-header">${data.title}</h3><p>${data.narrative}</p>`;
        }

        const player = document.getElementById('radio-player');
        const tunerBtn = document.getElementById('tune-btn');
        player.src = radioConfig.file;
        document.getElementById('track-info').innerText = "NOW PLAYING: " + radioConfig.title;
        tunerBtn.onclick = () => { player.paused ? (player.play(), tunerBtn.innerText="SIGNAL: LIVE") : (player.pause(), tunerBtn.innerText="TUNING // PAUSED"); };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CROSSROADS // ARCHIVE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #d1d1d1; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            line-height: 1.4;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #d1d1d1;
            padding: 20px;
        }

        .banner-zone {
            border-bottom: 2px solid #cf2121;
            text-align: center;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .banner-zone h1 {
            color: #fbbf24; /* Gold */
            text-transform: uppercase;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .section-label {
            color: #cf2121; /* Red */
            font-size: 0.7rem;
            text-transform: uppercase;
            margin: 15px 0 5px 0;
            border-bottom: 1px solid #cf2121;
            display: inline-block;
        }

        .zone-card {
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .zone-card:hover { border-color: #fbbf24; }
        .zone-title { color: #fff; font-weight: bold; }
        .spawn-btn {
            background: transparent;
            border: 1px solid #cf2121;
            color: #cf2121;
            padding: 5px;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .utility-panel {
            border: 1px dashed #fbbf24;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="banner-zone">
            <h1>The Crossroads RP</h1>
            <div style="font-size: 0.6rem; margin-top: 5px;">[SERVER: ACTIVE // COORDINATES: SOUTH MONTGOMERY]</div>
        </div>

        <div class="section-label">Select Era Coordinate</div>
        <div class="zone-card" onclick="jumpToNode('east')">
            <div class="zone-title">Exit 169 // The Blockade</div>
            <button class="spawn-btn">Initialize Connection</button>
        </div>

        <div class="section-label">System Access</div>
        <div class="utility-panel" onclick="routeToPage('characters_and_conflicts.html')">
            <div style="color: #fbbf24;">// NIGHT GODS & COLLECTORS</div>
        </div>
        <div class="utility-panel" onclick="routeToPage('contribute.html')">
            <div style="color: #fbbf24;">// FAMILY BIBLE ARCHIVE</div>
        </div>
    </div>
<!-- WZRD 77.7 FM SYSTEM MODULE -->
<audio id="radio-player" style="display:none;"></audio>

<div id="wzrd-tuner" style="position:fixed; bottom:0; width:100%; background:#000; border-top:2px solid #cf2121; padding:10px; z-index:9999; font-family: 'Courier New', Courier, monospace; font-size: 11px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="color:#cf2121; font-weight:bold;">WZRD 77.7 FM</div>
        <button id="tune-btn" style="background:transparent; border:1px solid #cf2121; color:#cf2121; padding:2px 8px; cursor:pointer; font-family:inherit;">TUNING...</button>
    </div>
    <!-- Track Info Label -->
    <div id="track-info" style="color:#fbbf24; margin-top:5px; text-transform:uppercase; overflow:hidden; white-space:nowrap;">
        STATION STANDBY...
    </div>
</div>

<script>
    const radioMap = {
        'index.html': { file: '05_Advancement.mp3', title: '05 ADVANCEMENT // EVAN MILLIGAN & JAMES GARDIN' },
        'contribute.html': { file: '15_Narissa.mp3', title: '15 NARISSA\'S HOME // CARE-GIVER ROAD TRIP' },
        'cosmogram.html': { file: '07_Dogon.mp3', title: '07 BEYOND // THE DOGON HAVE LANDED' },
        'characters_and_conflicts.html': { file: '10_Field.mp3', title: '10 SHAKE THE FIELD // JUICCY DA MASTER' }
    };

    function initRadio() {
        const player = document.getElementById('radio-player');
        const tunerBtn = document.getElementById('tune-btn');
        const trackDisplay = document.getElementById('track-info');
        
        const path = window.location.pathname.split('/').pop() || 'index.html';
        const trackData = radioMap[path] || radioMap['index.html'];
        
        // UPDATE PATH HERE: If files are in a folder, change to 'audio/' + trackData.file
        player.src = trackData.file; 
        trackDisplay.innerText = "NOW PLAYING: " + trackData.title;

        tunerBtn.onclick = function() {
            if (player.paused) {
                player.play().then(() => {
                    tunerBtn.innerText = "SIGNAL: LIVE";
                });
            } else {
                player.pause();
                tunerBtn.innerText = "TUNING // PAUSED";
            }
        };
    }
    window.onload = initRadio;
</script>
</body>
</html>

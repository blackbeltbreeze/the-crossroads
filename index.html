<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CROSSROADS // PREPARATION POD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #d1d1d1; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }

        .pod { 
            width: 90%; 
            max-width: 500px; 
            padding: 40px; 
            border: 1px solid #333; 
            text-align: center; 
            background: rgba(255, 255, 255, 0.02); 
        }

        .pulse-circle { 
            width: 60px; 
            height: 60px; 
            border: 2px solid #fbbf24; 
            border-radius: 50%; 
            margin: 20px auto; 
            animation: breathe 8s infinite ease-in-out; 
        }

        @keyframes breathe { 
            0%, 100% { transform: scale(1); opacity: 0.5; } 
            50% { transform: scale(1.5); opacity: 1; } 
        }

        .anchor-point { 
            padding: 20px; 
            border: 1px solid #cf2121; 
            cursor: pointer; 
            transition: 0.6s ease-in-out; 
            margin-top: 20px; 
            color: #fff;
        }

        .anchor-point:hover { 
            border-color: #fbbf24; 
            background: rgba(207, 33, 33, 0.1); 
        }

        /* TUNER STYLES */
        #wzrd-tuner { position:fixed; bottom:0; width:100%; background:#000; border-top:2px solid #cf2121; padding:10px; z-index:9999; font-size: 11px; }
        #track-info { color: #fbbf24; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="pod">
        <h1>STATION CALIBRATION</h1>
        <p>Grounding protocols active. Orient to your environment.</p>
        
        <div class="pulse-circle"></div>
        
        <div class="anchor-point" onclick="window.location.href='holodeck.html'">
            <h2>ACCESS HOLODECK ARCHIVE</h2>
        </div>
    </div>

    <!-- WZRD 77.7 FM SYSTEM MODULE -->
    <audio id="radio-player" style="display:none;"></audio>
    <div id="wzrd-tuner">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="color:#cf2121; font-weight:bold;">WZRD 77.7 FM</div>
            <button id="tune-btn" style="background:transparent; border:1px solid #cf2121; color:#cf2121; padding:2px 8px; cursor:pointer; font-family:inherit;">TUNING...</button>
        </div>
        <div id="track-info">STATION STANDBY...</div>
    </div>

    <script>
        const radioMap = {
            'index.html': { 
                file: 'Culture%20Lab%20from%20Western%20States%20Center%20-%20Smoke%20%26%20Mirrors%20-%2005%20Advancement%20featuring%20evan%20milligan%2C%20James%20Gardin%20and%20Juicyy%20Da%20Master.mp3', 
                title: '05 ADVANCEMENT // JAMES GARDIN, JUICCY DA MASTER, AND AFROFUTURE' 
            },
            'holodeck.html': { 
                file: '07_Innerstates.mp3', 
                title: '07 INNERSTATES // CULTURE LAB, DOPE DOODIE, AND EVAN MILLIGAN' 
            }
        };

        function initRadio() {
            const player = document.getElementById('radio-player');
            const tunerBtn = document.getElementById('tune-btn');
            const trackDisplay = document.getElementById('track-info');
            const path = window.location.pathname.split('/').pop() || 'index.html';
            const trackData = radioMap[path] || radioMap['index.html'];
            
            player.src = trackData.file;
            trackDisplay.innerText = "NOW PLAYING: " + trackData.title;

            tunerBtn.onclick = function() {
                if (player.paused) {
                    player.play().then(() => {
                        tunerBtn.innerText = "SIGNAL: LIVE";
                    }).catch(err => {
                        console.error("Playback failed:", err);
                        tunerBtn.innerText = "ERROR // CHECK CONSOLE";
                    });
                } else {
                    player.pause();
                    tunerBtn.innerText = "TUNING // PAUSED";
                }
            };
        }
        window.onload = initRadio;
    </script>
</body>
</html>

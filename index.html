<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crossroads | System Boot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fbbf24;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .terminal-container {
            max-width: 800px;
            width: 100%;
            border: 1px solid #fbbf24;
            background: #050505;
            padding: 30px;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.1);
        }

        .header-block {
            border-bottom: 1px dashed #fbbf24;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .meta-text {
            font-size: 0.85rem;
            color: #856404;
            margin-top: 5px;
        }

        p.manifesto {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 4-Axis Cosmogram Route Matrix */
        .grid-choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .choice-card {
            border: 1px solid #fbbf24;
            background: transparent;
            color: #fbbf24;
            font-family: 'Courier New', monospace;
            padding: 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .choice-card:hover {
            background: #fbbf24;
            color: #000;
            box-shadow: 0 0 15px #fbbf24;
        }

        .choice-card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .choice-card p {
            font-size: 0.85rem;
            line-height: 1.4;
            opacity: 0.8;
        }

        /* Hover swap trick for text clarity */
        .choice-card:hover p {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .grid-choices {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="header-block">
            <h1>CROSSROADS SYSTEM OVERRIDE</h1>
            <div class="meta-text">SOURCE: WZRD 77.7 FM ARCHIVE // FREQUENCY LOCKED</div>
        </div>

        <p class="manifesto">
            Time does not move in a straight line down Highway 65. The fence stands firm, the roots hold fast, and the tape logs are spinning. Select an entry coordinates node to initialize transmission.
        </p>

        <!-- Immediate engagement: The 4 major chronological exit nodes -->
        <div class="grid-choices">
            <button class="choice-card" onclick="routeTo('168')">
                <h3>[EXIT 168: 1996]</h3>
                <p>The Chalk Drawn. High school assembly, raw djembe rhythms, and ancestral warnings hidden inside the cassette deck.</p>
            </button>

            <button class="choice-card" onclick="routeTo('169')">
                <h3>[EXIT 169: 2026]</h3>
                <p>The Occupation. Real-time friction on the interstate asphalt. Jamal's live broadcast signal cutting through the darkness.</p>
            </button>

            <button class="choice-card" onclick="routeTo('170')">
                <h3>[EXIT 2118]</h3>
                <p>The Sanctuary. Old memories calcified inside the roots of the mammoth skyscraper oak. The trial begins.</p>
            </button>

            <button class="choice-card" onclick="routeTo('171')">
                <h3>[EXIT 3176+]</h3>
                <p>The Pillar Hall. The furthest future. Narissa hums the lineage melody to deliver the ultimate refusal to the Federation.</p>
            </button>
        </div>
    </div>

    <script>
        function routeTo(exitId) {
            // Seed the destination choices into localStorage immediately on click
            localStorage.setItem('selected_initial_exit', exitId);
            localStorage.setItem('portal_gate_passed', 'true');
            
            // Send them directly to your master layout engine page
            window.location.href = 'portal.html';
        }
    </script>
</body>
</html>

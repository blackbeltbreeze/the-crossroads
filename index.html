<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CROSSROADS // ARCHIVE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #d1d1d1; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            line-height: 1.4;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #d1d1d1;
            padding: 20px;
        }

        .banner-zone {
            border-bottom: 2px solid #cf2121;
            text-align: center;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .banner-zone h1 {
            color: #fbbf24; /* Gold */
            text-transform: uppercase;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .section-label {
            color: #cf2121; /* Red */
            font-size: 0.7rem;
            text-transform: uppercase;
            margin: 15px 0 5px 0;
            border-bottom: 1px solid #cf2121;
            display: inline-block;
        }

        .zone-card {
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .zone-card:hover { border-color: #fbbf24; }
        .zone-title { color: #fff; font-weight: bold; }
        .spawn-btn {
            background: transparent;
            border: 1px solid #cf2121;
            color: #cf2121;
            padding: 5px;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .utility-panel {
            border: 1px dashed #fbbf24;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="banner-zone">
            <h1>The Crossroads RP</h1>
            <div style="font-size: 0.6rem; margin-top: 5px;">[SERVER: ACTIVE // COORDINATES: SOUTH MONTGOMERY]</div>
        </div>

        <div class="section-label">Select Era Coordinate</div>
        <div class="zone-card" onclick="jumpToNode('east')">
            <div class="zone-title">Exit 169 // The Blockade</div>
            <button class="spawn-btn">Initialize Connection</button>
        </div>

        <div class="section-label">System Access</div>
        <div class="utility-panel" onclick="routeToPage('characters_and_conflicts.html')">
            <div style="color: #fbbf24;">// NIGHT GODS & COLLECTORS</div>
        </div>
        <div class="utility-panel" onclick="routeToPage('contribute.html')">
            <div style="color: #fbbf24;">// FAMILY BIBLE ARCHIVE</div>
        </div>
    </div>

    <!-- WZRD 77.7 FM SYSTEM MODULE -->
   <script>
    const radioMap = {
        'index.html': '05_Advancement.mp3',
        'contribute.html': '15_Narissa.mp3',
        'cosmogram.html': '07_Dogon.mp3',
        'characters_and_conflicts.html': '10_Field.mp3'
    };

    function initRadio() {
        const player = document.getElementById('radio-player');
        const tunerBtn = document.querySelector('#wzrd-tuner button');
        const path = window.location.pathname.split('/').pop() || 'index.html';
        const trackShortName = radioMap[path] || radioMap['index.html'];
        
        player.src = trackShortName;
        player.loop = true;

        // Attempt autoplay
        player.play().then(() => {
            tunerBtn.innerText = "SIGNAL: LIVE";
        }).catch(() => {
            tunerBtn.innerText = "TUNING // PRESS TO PLAY";
        });
    }

    // Update button text when clicked
    document.querySelector('#wzrd-tuner button').addEventListener('click', function() {
        const player = document.getElementById('radio-player');
        if (player.paused) {
            player.play();
            this.innerText = "SIGNAL: LIVE";
        } else {
            player.pause();
            this.innerText = "TUNING // PAUSED";
        }
    });

    window.onload = initRadio;
</script>
 
</body>
</html>

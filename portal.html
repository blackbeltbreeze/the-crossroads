<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crossroads: Tactical Portal | WZRD 77.7 FM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #03030c;
            color: #ddd;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 8-BIT ALERT STRIP */
        .drone-alert-ticker {
            background: #cf2121;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 8px;
            text-align: center;
            letter-spacing: 2px;
            border-bottom: 3px solid #fbbf24;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { background: #cf2121; }
            50% { background: #000; }
        }

        /* AUDIO SYSTEM BANNER */
        .audio-override-banner {
            background: #0f172e;
            border-bottom: 2px solid #fbbf24;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .radio-status {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #fbbf24;
        }

        .tune-in-btn {
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #cf2121;
        }

        .tune-in-btn.active {
            background: #065f46;
            color: #fff;
            box-shadow: 3px 3px 0 #000;
        }

        /* SCREEN GLITCH EFFECTS DURING TRANSITIONS */
        .glitch-active {
            animation: screenShake 0.15s infinite;
            filter: hue-rotate(90deg) contrast(150%);
        }

        @keyframes screenShake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        /* MAIN CONTAINER MATRIX */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; }
        }

        /* TACTICAL MAP CONTAINER */
        #map-wrapper {
            background: #070714;
            border: 3px solid #fbbf24;
            padding: 2rem;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.1);
            position: relative;
        }

        .map-header {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #fbbf24;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        #cosmogram-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border: 1px dashed #333;
            padding: 1rem;
        }

        svg {
            max-width: 100%;
            height: auto;
        }

        .cosmogram-point {
            cursor: pointer;
        }

        .cosmogram-point circle {
            fill: #03030c;
            stroke: #fbbf24;
            stroke-width: 3;
            transition: all 0.2s steps(4);
        }

        .cosmogram-point:hover circle, .cosmogram-point.active circle {
            fill: #cf2121;
            stroke: #fff;
            r: 10;
        }

        .cosmogram-label {
            fill: #fbbf24;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            text-anchor: middle;
        }

        /* REAL-TIME TRANSMISSION CONTENT */
        #transmission-feed {
            background: #020205;
            border: 3px solid #cf2121;
            padding: 2rem;
            box-shadow: 5px 5px 0 #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .feed-header {
            border-bottom: 2px dashed #cf2121;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .feed-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #fff;
        }

        .feed-meta {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #fbbf24;
            margin-top: 5px;
        }

        .feed-body {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #e2e8f0;
            margin-bottom: 2rem;
        }

        .feed-body strong {
            color: #fbbf24;
        }

        .feed-body em {
            color: #ff6b6b;
            font-style: normal;
            border-bottom: 1px dotted #ff6b6b;
        }

        /* THE ACTION/PUNCHLINE CARDS */
        .tactical-card {
            background: rgba(251, 191, 36, 0.05);
            border: 1px solid #fbbf24;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .tactical-card h4 {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #fbbf24;
            margin-bottom: 0.5rem;
        }

        .action-link {
            display: inline-block;
            margin-top: 1rem;
            background: #cf2121;
            color: #fff;
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 10px 15px;
            box-shadow: 2px 2px 0 #fff;
        }

        .action-link:hover {
            background: #fbbf24;
            color: #000;
            box-shadow: 2px 2px 0 #cf2121;
        }
    </style>
</head>
<body id="game-viewport">

    <!-- SIGNAL DISRUPTION TICKER -->
    <div class="drone-alert-ticker" id="droneTicker">
        ⚠️ ALERT: ENEMY DRONES OVERHEAD // RADIO SIGNAL IS DROPPING ⚠️
    </div>

    <!-- AUDIO DRIVER BRIDGE -->
    <div class="audio-override-banner">
        <div class="radio-status" id="radioStatus">RADIO: DISCONNECTED (77.7 FM)</div>
        <button class="tune-in-btn" id="audioBtn" onclick="toggleAudioStream()">TUNE IN TO TRANSMISSION</button>
    </div>

    <main>
        <!-- LEFT: INTUITIVE TACTICAL TRANSMISSION ROUTER -->
        <section id="map-wrapper">
            <div class="map-header">INTERSTATE 65 OCCUPATION RADAR</div>
            <div id="cosmogram-container">
                <svg viewBox="0 0 500 500">
                    <circle cx="250" cy="250" r="180" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="8,8"/>
                    
                    <!-- HIGHWAY PATHWAY GRAPHICS -->
                    <line x1="70" y1="250" x2="430" y2="250" stroke="#333" stroke-width="8"/>
                    <line x1="70" y1="250" x2="430" y2="250" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,6"/>

                    <!-- NODE 01: ON RAMP -->
                    <g class="cosmogram-point" data-point="on-ramp" onclick="loadNode('on-ramp')">
                        <circle cx="430" cy="250" r="8"/>
                        <text class="cosmogram-label" x="430" y="230">01_ON-RAMP</text>
                    </g>

                    <!-- NODE 02: EXIT 168 (1996) -->
                    <g class="cosmogram-point" data-point="exit-168" onclick="loadNode('exit-168')">
                        <circle cx="250" cy="70" r="8"/>
                        <text class="cosmogram-label" x="250" y="50">02_EXIT-168<tspan x="250" dy="10">(1996)</tspan></text>
                    </g>

                    <!-- NODE 03: EXIT 169 (2026 - MAIN TEETH) -->
                    <g class="cosmogram-point" data-point="exit-169" onclick="loadNode('exit-169')">
                        <circle cx="250" cy="250" r="12"/>
                        <text class="cosmogram-label" x="250" y="225">03_EXIT-169<tspan x="250" dy="10">(2026)</tspan></text>
                    </g>

                    <!-- NODE 04: EXIT 170 (2118) -->
                    <g class="cosmogram-point" data-point="exit-170" onclick="loadNode('exit-170')">
                        <circle cx="70" cy="250" r="8"/>
                        <text class="cosmogram-label" x="70" y="280">04_EXIT-170<tspan x="70" dy="10">(2118)</tspan></text>
                    </g>

                    <!-- NODE 05: EXIT 171 (FUTURE) -->
                    <g class="cosmogram-point" data-point="exit-171" onclick="loadNode('exit-171')">
                        <circle cx="250" cy="430" r="8"/>
                        <text class="cosmogram-label" x="250" y="465">05_EXIT-171<tspan x="250" dy="10">(FUTURE)</tspan></text>
                    </g>

                    <!-- NODE 06: OFF RAMP -->
                    <g class="cosmogram-point" data-point="off-ramp" onclick="loadNode('off-ramp')">
                        <circle cx="370" cy="370" r="8"/>
                        <text class="cosmogram-label" x="370" y="395">06_OFF-RAMP</text>
                    </g>
                </svg>
            </div>
        </section>

        <!-- RIGHT: LIVE INTERACTIVE TRANSMISSION INJECTOR -->
        <section id="transmission-feed">
            <div>
                <div class="feed-header">
                    <div class="feed-title" id="nodeTitle">SIGNAL INTERCEPTED</div>
                    <div class="feed-meta" id="nodeMeta">FREQUENCY LOCKED</div>
                </div>
                <div class="feed-body" id="nodeText">
                    <!-- Dynamic text loads here -->
                </div>
            </div>

            <div class="tactical-card">
                <h4 id="cardLeader">OPERATIONAL MANAGER:</h4>
                <p id="cardDesc">Awaiting frequency alignment sync parameters.</p>
                <a href="#" class="action-link" id="actionBtn">INTERCEPT LIVE INTERACTION →</a>
            </div>
        </section>
    </main>

    <script>
        // HARMONIZED RECALIBRATED 6-POINT TRANSMISSION DATA ARRAY (CANON LOCKED)
        const corridorTransmissions = {
            'on-ramp': {
                title: "01 // THE ON RAMP",
                meta: "YEAR: 2026 | BOUNDARY ENTRY",
                text: "The threshold vectors are spinning up. The blockade is formalized. We are building the initial line across the highway boundaries. If you don't declare your lineage right here at the marker, the system defense flags you as a target.",
                leader: "TACTICAL HUB: PEPPAMAN",
                desc: "Initializing the raw djembe ground loops across the network registers.",
                actionText: "LOCK LINEAGE SIGNAL",
                targetUrl: "#"
            },
            'exit-168': {
                title: "02 // EXIT 168 [1996]",
                meta: "YEAR: 1996 | THE CHALK DRAWN",
                text: "Inside the high school assembly hall, the bass drops clean from the djembe heads. Tape decks are recording ancestral logs on hidden cassettes right under the administration's noses. The blueprints are distributed.",
                leader: "POV: MS. ORA & YOUTH RESISTANCE",
                desc: "Securing care networks before the state initiates physical retaliation.",
                actionText: "EXTRACT CASSETTE TAPE LOGS",
                targetUrl: "#"
            },
            'exit-169': {
                title: "03 // EXIT 169 [2026]",
                meta: "YEAR: 2026 | THE HIGHWAY OCCUPATION",
                text: "<strong>Dr. Tyra Washington</strong> stands dead center on the Interstate 65 asphalt. Bumper-to-bumper cars line the autonomous village grid. <em>Tactical drone sweeps loom overhead</em> trying to break the perimeter while Jamal's WZRD 77.7 pirate tower hotwires directly into the power main. Tyra is leading the ground orations, but she's hiding a pregnancy, and the air grows heavy as the circle prepares to descend into the tunnels where the dragon Bertha is bound.",
                leader: "POV: JAMAL & TYRA WASHINGTON",
                desc: "The 72-hour operational rupture. The transmission loops are active.",
                actionText: "ACCESS TRANSMISSION MASTER TAPES",
                targetUrl: "jamals-story.html"
            },
            'exit-170': {
                title: "04 // EXIT 170 [2118]",
                meta: "YEAR: 2118 | THE OAK SANCTUARY",
                text: "The concrete has crumbled but the memory stays. The skyscraper oak tree has completely grown through the core of the highway footprint. Archive files are processed directly inside the organic computing infrastructure.",
                leader: "POV: THE MEMORY ENGINEERS",
                desc: "Retrieval of historical records suppressed during the 2026 corporate emergency.",
                actionText: "SYNC ORGANIC LOG RESIDUE",
                targetUrl: "#"
            },
            'exit-171': {
                title: "05 // EXIT 171 [FURTHEST FUTURE]",
                meta: "YEAR: 3176 | THE PILLAR HALL",
                text: "Elliot John Henry McCall stands before the High Planning Guild. He summons the ancestral lineage tapes, using the memory of the Exit 169 ancestors to present a hard, absolute structural refusal to the Federation's extraction terms.",
                leader: "POV: ELLIOT McCALL (THE FUTURE LINEAGE)",
                desc: "The timeline loop seals itself completely via oral historical architecture.",
                actionText: "EXECUTE THE ULTIMATE REFUSAL",
                targetUrl: "#"
            },
            'off-ramp': {
                title: "06 // THE OFF RAMP",
                meta: "YEAR: UNSTABLE | INVERSION COMPLETION",
                text: "The main transit vector dissolves. The database metrics are calculated. The actions you took across the 1996 blueprints and the 2026 highway blockades compile to determine your historical alignment code.",
                leader: "SYSTEM CONTROL: THE DRAGON BERTHA",
                desc: "The final tally of the anti-dichotomy parameters.",
                actionText: "COMPILE DATA SUMMARY SYSTEM",
                targetUrl: "#"
            }
        };

        let audioActive = false;
        let audioCtx = null;

        function toggleAudioStream() {
            const btn = document.getElementById('audioBtn');
            const status = document.getElementById('radioStatus');
            
            if (!audioActive) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                btn.textContent = "STATION TUNED // BLASTING 77.7";
                btn.classList.add('active');
                status.textContent = "RADIO: LIVE FEED CONNECTED [WZRD 77.7 FM]";
                audioActive = true;
            } else {
                btn.textContent = "TUNE IN TO TRANSMISSION";
                btn.classList.remove('active');
                status.textContent = "RADIO: DISCONNECTED (77.7 FM)";
                audioActive = false;
            }
        }

        function loadNode(nodeId) {
            const data = corridorTransmissions[nodeId];
            if (!data) return;

            // Trigger visual drone glitch interference during transitions
            const viewport = document.getElementById('game-viewport');
            viewport.classList.add('glitch-active');
            document.getElementById('droneTicker').textContent = "⚠️ WARNING: DRONES BLOCKED THE FEED... SYSTEM SCANNING... ⚠️";
            
            setTimeout(() => {
                viewport.classList.remove('glitch-active');
                document.getElementById('droneTicker').textContent = "⚠️ ALERT: ENEMY DRONES OVERHEAD // RADIO SIGNAL IS DROPPING ⚠️";
            }, 1500);

            // Update Text Node Blocks
            document.getElementById('nodeTitle').innerHTML = data.title;
            document.getElementById('nodeMeta').innerHTML = data.meta;
            document.getElementById('nodeText').innerHTML = data.text;
            document.getElementById('cardLeader').innerHTML = data.leader;
            document.getElementById('cardDesc').innerHTML = data.desc;
            
            // Dynamic Button Redirection Logic
            const actionBtn = document.getElementById('actionBtn');
            actionBtn.innerHTML = data.actionText + " →";
            actionBtn.setAttribute('href', data.targetUrl);

            // Toggle active visual highlight rings on SVG map
            document.querySelectorAll('.cosmogram-point').forEach(p => p.classList.remove('active'));
            document.querySelector(`[data-point="${nodeId}"]`).classList.add('active');
        }

        // Initialize state on initial execution load
        window.onload = () => {
            const initialSelection = localStorage.getItem('selected_initial_exit') || 'exit-169';
            loadNode(initialSelection);
        };
    </script>
</body>
</html>
